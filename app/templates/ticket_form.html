{% extends 'base.html' %}{% block content %}<div class="topbar"><div><h1>Create Ticket</h1><p class="muted">AI sentiment analysis automatically suggests a priority.</p></div></div><section class="panel form-panel"><form method="post" class="form-grid"><div><label>Customer name</label><input name="customer_name" required></div><div><label>Customer email</label><input type="email" name="customer_email" required></div><div class="full-col"><label>Subject</label><input name="subject" required></div><div><label>Category</label><select name="category"><option>Technical</option><option>Billing</option><option>Account</option><option>Product</option><option>Support</option><option>Other</option></select></div><div class="full-col"><label>Description</label><textarea name="description" rows="7" required></textarea></div><div class="full-col"><button class="btn primary">Create & Analyze Ticket</button></div></form></section>{% endblock %}
